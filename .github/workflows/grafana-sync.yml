name: Grafana Dashboard Sync

on:
  push:
    branches:
      - main
    paths:
      - '**.json'
  workflow_dispatch:

jobs:
  sync-dev:
    name: Sync → DEV (my-grafana)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Push Dashboards via Grafana API
        run: |
          POD=$(kubectl get pod -n my-grafana -l app=grafana -o jsonpath='{.items[0].metadata.name}')
          echo "📦 Pod: $POD"

          for file in *.json; do
            echo "📊 Yükleniyor: $file"
            cat "$file" | jq '{dashboard: .spec, overwrite: true}' > /tmp/wrapped_"$file"
            kubectl cp /tmp/wrapped_"$file" my-grafana/$POD:/tmp/wrapped_"$file"
            response=$(kubectl exec -n my-grafana $POD -- \
              curl -s -o /tmp/response.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN_DEV }}" \
              -d @/tmp/wrapped_"$file" \
              http://localhost:3000/api/dashboards/db)
            echo "  → HTTP $response"
            kubectl exec -n my-grafana $POD -- cat /tmp/response.json
            echo ""
          done
          echo "✅ Tamamlandı"
