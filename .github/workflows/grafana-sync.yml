name: Grafana Dashboard Sync

on:
  push:
    branches:
      - main
    paths:
      - '**.json'
  workflow_dispatch:

jobs:
  sync-dev:
    name: Sync → DEV (my-grafana)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Port-forward Grafana
        run: |
          kubectl port-forward -n my-grafana deployment/grafana 3000:3000 &
          echo "⏳ Bağlantı bekleniyor..."
          sleep 8

      - name: Push Dashboards via Grafana API
        run: |
          for file in *.json; do
            echo "📊 Yükleniyor: $file"
            payload=$(cat "$file" | jq '{dashboard: ., overwrite: true, folderId: 0}')
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -u "admin:${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
              -d "$payload" \
              http://localhost:3000/api/dashboards/db)
            echo "  → HTTP $response"
          done
          echo "✅ Tüm dashboardlar yüklendi"
