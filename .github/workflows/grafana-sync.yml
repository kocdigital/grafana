name: Grafana Dashboard Sync

on:
  push:
    branches:
      - main
    paths:
      - '**.json'
  workflow_dispatch:

jobs:
  sync-dev:
    name: Sync → DEV (my-grafana)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Port-forward Grafana
        run: |
          kubectl port-forward svc/grafana 3000:3000 -n my-grafana &
          echo "⏳ Port-forward hazır olana kadar bekleniyor..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Grafana hazır!"
              break
            fi
            echo "  Deneme $i/30..."
            sleep 2
          done

      - name: Push Dashboards via Grafana API
        run: |
          for file in *.json; do
            echo "📊 Yükleniyor: $file"
            payload=$(cat "$file" | jq '{dashboard: ., overwrite: true, folderId: 0}')
            response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -u "admin:${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
              -d "$payload" \
              http://localhost:3000/api/dashboards/db)
            echo "  → HTTP $response"
            cat /tmp/response.json
            echo ""
          done
          echo "✅ Tüm dashboardlar yüklendi"
