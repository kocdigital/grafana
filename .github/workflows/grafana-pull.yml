name: Grafana Dashboard Pull

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:

jobs:
  pull-dev:
    name: Pull ← DEV (my-grafana)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Pull Dashboards from Grafana
        run: |
          POD=$(kubectl get pod -n my-grafana -l app=grafana -o jsonpath='{.items[0].metadata.name}')
          echo "📦 Pod: $POD"

          # Tüm dashboard uid'lerini al
          UIDS=$(kubectl exec -n my-grafana $POD -- \
            curl -s -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN_DEV }}" \
            "http://localhost:3000/api/search?type=dash-db" | \
            jq -r '.[].uid')

          for uid in $UIDS; do
            echo "📥 Çekiliyor: $uid"

            # Dashboard içeriğini al
            RESPONSE=$(kubectl exec -n my-grafana $POD -- \
              curl -s -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN_DEV }}" \
              "http://localhost:3000/api/dashboards/uid/$uid")

            TITLE=$(echo "$RESPONSE" | jq -r '.dashboard.title')
            SLUG=$(echo "$RESPONSE" | jq -r '.meta.slug')

            # Repo'da uid içeren mevcut dosyayı bul
            EXISTING=$(grep -rl "\"uid\": \"$uid\"" *.json 2>/dev/null | head -1)

            if [ -n "$EXISTING" ]; then
              # Mevcut dosyayı güncelle
              TARGET="$EXISTING"
              echo "  🔄 Mevcut dosya güncelleniyor: $TARGET"
            else
              # Yeni dosya oluştur (slug ile)
              TARGET="${SLUG}.json"
              echo "  🆕 Yeni dosya: $TARGET"
            fi

            # CRD formatına wrap et ve kaydet
            echo "$RESPONSE" | jq '{
              apiVersion: "dashboard.grafana.app/v0alpha1",
              kind: "Dashboard",
              metadata: {name: .meta.slug},
              spec: .dashboard
            }' > "$TARGET"

            echo "  ✅ $TITLE → $TARGET"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          if git diff --staged --quiet; then
            echo "ℹ️ Değişiklik yok"
          else
            git commit -m "🔄 Grafana'dan dashboard sync - $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Repo güncellendi"
          fi
